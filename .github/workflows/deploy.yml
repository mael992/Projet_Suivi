name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      # Le code vit sur l'hote (bind-monte dans le conteneur) ; seules les
      # commandes PHP tournent dans le conteneur web du stack MGDS.
      # IMPORTANT : artisan tourne en 1000:1000 (et non en root), sinon les
      # fichiers ecrits dans storage/ (logs, vues compilees, caches)
      # appartiennent a root et PHP-FPM (www-data) ne peut plus les ecrire :
      # le site renvoie alors une erreur 500 des qu'une ecriture est tentee.
      # Le tunnel cloudflared coupe parfois la connexion (« websocket: bad
      # handshake ») avant même le debut du deploiement. Toutes les etapes
      # ci-dessous etant rejouables, on retente jusqu'a 3 fois.
      - name: 🚀 Deploy
        run: |
          deploiement() {
            ssh deploy "
              cd ${{ secrets.DEPLOY_PATH }} &&
              git -C app fetch origin main &&
              git -C app reset --hard origin/main &&
              docker compose exec -T -u 1000:1000 -e COMPOSER_HOME=/tmp/composer web \
                composer install --no-dev --optimize-autoloader --no-interaction &&
              docker compose exec -T -u 1000:1000 -e HOME=/tmp web php artisan migrate --force &&
              (docker compose exec -T -u 1000:1000 -e HOME=/tmp web php artisan storage:link || true) &&
              docker compose exec -T -u 1000:1000 -e HOME=/tmp web php artisan config:cache &&
              docker compose exec -T -u 1000:1000 -e HOME=/tmp web php artisan route:cache &&
              docker compose exec -T -u 1000:1000 -e HOME=/tmp web php artisan view:cache &&
              docker compose restart scheduler queue
            "
          }

          for tentative in 1 2 3; do
            echo "▶ Tentative de deploiement $tentative/3"
            if deploiement; then
              echo "✅ Deploiement reussi (tentative $tentative)"
              exit 0
            fi
            echo "⚠ Echec de la tentative $tentative (tunnel indisponible ?)"
            # Pause avant de retenter (le && seul ferait echouer le script sous « bash -e »)
            if [ "$tentative" -lt 3 ]; then sleep 20; fi
          done

          echo "❌ Deploiement impossible apres 3 tentatives"
          exit 1

      - name: ✅ Verifier que le site repond
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://m-gds.com/) || CODE=000
            [ "$CODE" = "200" ] && echo "Site en ligne (HTTP 200)" && exit 0
            echo "Tentative $i : HTTP $CODE"
            sleep 10
          done
          echo "Le site ne repond pas correctement apres deploiement"
          exit 1
